<!-- Logotipo Alupar — versão em negativo (branco sobre fundo azul).
     Mesmos traçados e mesmo viewBox da versão principal (logo-alupar.svg);
     só os seis traçados do lettering trocam #004F9D por branco. O traço
     verde não muda.

     É esta que o cabeçalho usa: o box do tema (bg-logo.png) é azul sólido
     #004F9D, e a versão principal é azul sobre azul — ilegível. O tema
     atual sempre pareou o box com a versão em negativo
     (img/logo-alupar.png, branco + verde, fundo transparente); a
     restauração baixou o box e esqueceu do logotipo que vai em cima.

     Pendente da mesma conferência do Marketing que a versão principal. -->
