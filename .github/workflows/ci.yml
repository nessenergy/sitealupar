name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # O corpo extraído do tema vem com metade de cada par de tags. Se o
      # balanceamento regredir, o `set:html` injetaria HTML inválido nas
      # páginas — então a checagem é condição de merge, não passo manual.
      - name: Corpo do acervo balanceado
        run: node scripts/balancear-conteudo.mjs --verificar

      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # Os critérios de aceite viram condição de merge. Sem isto, "não deixar
  # congelar de novo" é promessa; com isto, é regra executável.
  qualidade:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Lighthouse (performance, acessibilidade, SEO, orçamento de peso)
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Confere os links internos do build. As URLs absolutas para
      # www.alupar.com.br são canonical e hreflang — metadados que apontam para
      # onde o site vai estar, não links navegáveis a validar antes do go-live.
      # Depois da virada, trocar este skip por uma verificação do mapa de 301.
      - name: Verificador de links
        run: npx --yes linkinator dist --recurse --silent --skip "^https?://(www\.)?(alupar\.com\.br|alupar\.us6\.quickconnect\.to|alupar\.gupy\.io)"
